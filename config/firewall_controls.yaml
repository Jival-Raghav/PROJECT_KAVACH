# Security controls scored from firewall-log evidence.
# Mappings are an audit aid written by the Kavach team. Check them against the official standards
# before using them in any formal report. A log can show a control failing; it cannot prove that
# the control works.
controls:
  - id: LOG-PROTECT
    title: Audit logging stays on and protected
    refs: [NIST 800-53 AU-9, ISO 27001 A.8.15, SOC 2 CC7.2]
    techniques: [T1562.001, T1070]
  - id: ACCOUNT-MGMT
    title: Administrator accounts are created and removed under control
    refs: [NIST 800-53 AC-2, ISO 27001 A.5.16, SOC 2 CC6.2]
    techniques: [T1136.001, T1098, T1070]
  - id: AUTH-ACCESS
    title: Remote and admin logins come from expected places
    refs: [NIST 800-53 AC-17, ISO 27001 A.8.5, SOC 2 CC6.1]
    techniques: [T1078, T1133, T1110]
  - id: CHANGE-CONTROL
    title: Firewall policy changes are controlled
    refs: [NIST 800-53 CM-3, ISO 27001 A.8.32, SOC 2 CC8.1]
    techniques: [T1562.004]
  - id: BOUNDARY
    title: Internet-facing services are protected
    refs: [NIST 800-53 SC-7, ISO 27001 A.8.20, SOC 2 CC6.6]
    techniques: [T1190, T1595, T1595.001, T1505.003]
  - id: MALWARE
    title: Malware is stopped before it reaches hosts
    refs: [NIST 800-53 SI-3, ISO 27001 A.8.7, SOC 2 CC6.8]
    techniques: [T1204.002, T1105, T1036.007]
  - id: DATA-FLOW
    title: Data does not leave through uncontrolled channels
    refs: [NIST 800-53 AC-4, ISO 27001 A.8.12, SOC 2 CC6.7]
    techniques: [T1041, T1030, T1048, T1048.003]
  - id: C2-MONITORING
    title: Command-and-control traffic is detected and stopped
    refs: [NIST 800-53 SI-4, ISO 27001 A.8.16, SOC 2 CC7.2]
    techniques: [T1071, T1071.001, T1071.004]
  - id: SEGMENTATION
    title: Internal zones limit lateral movement
    refs: [NIST 800-53 SC-7(5), ISO 27001 A.8.22, SOC 2 CC6.6]
    techniques: [T1021, T1021.001, T1021.002, T1021.004, T1046]
